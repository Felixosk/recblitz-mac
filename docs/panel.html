<!doctype html>
<meta charset="utf-8">
<style>
  /* Nahaufnahme: das echte Panel im Ruhezustand und beim Hochladen. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:900px; height:520px; display:flex; align-items:flex-start; justify-content:center; gap:40px; padding-top:56px;
    background: linear-gradient(150deg,#16233d 0%,#22405f 55%,#2c5570 100%);
    font: 400 13px -apple-system,"SF Pro Text",sans-serif; color:#c9d6e6; }
  figure { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .p { width:340px; border-radius:13px; overflow:hidden; border:.5px solid rgba(255,255,255,.10);
    box-shadow:0 24px 64px rgba(0,0,0,.55); }
  .p img { width:340px; display:block; }
  figcaption { font: 600 11.5px ui-monospace,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; color:#2EC7A0; }
</style>
<figure><div class="p"><img src="raw/panel-idle.png"></div><figcaption>Ready</figcaption></figure>
<figure><div class="p"><img src="raw/panel-uploading.png"></div><figcaption>Uploading</figcaption></figure>
